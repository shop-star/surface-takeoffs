name: Deploy GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Stage site files
        run: |
          mkdir -p _site/assets _site/app _site/vendor/pdfjs _site/vendor/pdf-lib _site/vendor/jszip
          cp index.html _site/
          cp assets/*.png _site/assets/
          cp app/index.html app/app.css app/app.js _site/app/
          cp vendor/pdfjs/*.js _site/vendor/pdfjs/
          cp vendor/pdf-lib/*.js _site/vendor/pdf-lib/
          cp vendor/jszip/*.js _site/vendor/jszip/
          # Every deploy gets a distinct query string on script/style
          # references, so browsers fetch fresh copies instead of reusing
          # stale cached ones.
          sed -i "s/__CACHEBUST__/${GITHUB_SHA}/g" _site/app/index.html _site/app/app.js

      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
